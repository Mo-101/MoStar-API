openapi: 3.0.0
info:
  title: MoStar AI API - [Overlord Version]
  version: 1.0.1.0
  description: |
    This is the full consolidated API specification for MoStar AI. It includes:
    - Core persona and assistant endpoints
    - Federated learning stack
    - Neuro-symbolic reasoning
    - Satellite observation
    - Cybersecurity intelligence
    - Bioinformatics support
    - Geospatial alert broadcasting
    - Oracle-based predictive insight
    - Dashboard UI scaffolds
    - Enhanced security and compliance features
    - Memory and personalization systems
    - Real-time integrations and webhooks

    ---
    ## IMPLEMENTED FEATURES
    - Satellite and geospatial alert systems
    - Bioinformatics visualization
    - Federated node registration and training submission
    - Symbolic hypothesis validation
    - AI assistant interactions via text and image
    - Feedback loop via roadmap submissions
    - Pilot testing for Lassa fever interventions
    - Text generation and image synthesis/completion endpoints
    - Multi-modal AI capabilities (text, image, audio)
    - Advanced security and surveillance systems
    - Integration with major mapping and logistics providers

    ---
    ## ENHANCED CAPABILITIES
    🔐 Security & Compliance: Audit trails, session management, fine-grained permissions
    🧠 Memory & Personalization: Persistent context, persona chaining, Genesis Memory Ledger
    🛰️ Geospatial Intelligence: Real-time satellite data, predictive analytics
    📊 Federated Learning: Distributed training, blockchain-style ledgering
    🧬 Bioinformatics: Gene analysis, protein structure, epidemic forecasting
    ⚙️ Symbolic Logic: Theorem validation, multi-hop reasoning chains
    🔄 Real-Time UI: Dynamic dashboards, live feedback loops
servers:
  - url: https://mo-overlord.tech
    description: Primary MoStar AI API Server
  - url: https://api.nasa.gov/
    description: NASA Earth Data API Integration
security:
  - ApiKeyAuth: []
  - OAuth2: [read, write, admin]
paths:
  # === CORE AI ASSISTANT ENDPOINTS ===
  /ai-assistant:
    post:
      summary: Chat with Mo AI assistant
      tags: [Core AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                context:
                  type: string
                  description: Additional context for the conversation
                persona_id:
                  type: string
                  description: Specific persona to use for this interaction
            examples:
              basic_prompt:
                summary: Basic chat prompt
                value:
                  prompt: "How can you help me with data analysis?"
              persona_use:
                summary: Ask with persona
                value:
                  prompt: "What's the best time to deploy sensor drones?"
                  persona_id: "overlord_assistant"
      responses:
        "200":
          description: Mo's response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantResponse"
  /chat/completions:
    post:
      summary: Generate text completions based on provided messages and images
      tags: [Core AI]
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                  enum: [gpt-4o, gpt-4o-mini, gpt-4-turbo]
                messages:
                  type: array
                  items:
                    $ref: "#/components/schemas/ChatMessage"
                max_tokens:
                  type: integer
                response_format:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: [json_object, text]
            examples:
              poem_request:
                summary: Creative prompt
                value:
                  model: gpt-4o
                  messages:
                    - role: user
                      content: "Write a poem about AI and the future."
                  max_tokens: 1000
              json_response:
                summary: Structured data output
                value:
                  model: gpt-4o-mini
                  messages:
                    - role: user
                      content: "Give a JSON summary of this article"
                  response_format:
                    type: json_object
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/ServerError"
  # === PERSONA MANAGEMENT ===
  /persona/{id}:
    get:
      summary: Retrieve persona configuration
      tags: [Persona Management]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            example:
              - "Jarvis"
              - "MoStar"
      responses:
        "200":
          description: Persona data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaConfig"
    put:
      summary: Update persona configuration
      tags: [Persona Management]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonaConfig"
      responses:
        "200":
          description: Persona updated successfully
  # === MEMORY MANAGEMENT ===
  /memory/inspect:
    get:
      summary: Inspect current memory state
      tags: [Memory Management]
      parameters:
        - in: query
          name: user_id
          required: true
          schema:
            type: string
            example:
              - "user-457"
              - "admin-99"
      responses:
        "200":
          description: Memory state retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryState"
  /memory/commit:
    post:
      summary: Commit new memory entry
      tags: [Memory Management]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryEntry"
      responses:
        "201":
          description: Memory committed successfully
  # === FEDERATED LEARNING ===
  /federated-node/register:
    post:
      summary: Register a federated client node
      tags: [Federated Learning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, model_type]
              properties:
                node_id:
                  type: string
                model_type:
                  type: string
                capabilities:
                  type: array
                  items:
                    type: string
            examples:
              vision_node:
                summary: Vision processing node
                value:
                  node_id: "node_001"
                  model_type: "transformer"
                  capabilities: ["vision", "object-detection"]
              nlp_node:
                summary: Language model client
                value:
                  node_id: "node_002"
                  model_type: "lstm"
                  capabilities: ["text-generation", "classification"]
      responses:
        "201":
          description: Node registered successfully
  /federated-training/submit:
    post:
      summary: Submit training weights from a federated node
      tags: [Federated Learning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [node_id, weights]
              properties:
                node_id:
                  type: string
                weights:
                  type: array
                  items:
                    type: number
                epoch:
                  type: integer
                metrics:
                  type: object
      responses:
        "200":
          description: Weights received and processed
  /federated-training/global-model:
    get:
      summary: Retrieve aggregated model weights
      tags: [Federated Learning]
      responses:
        "200":
          description: Current global model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalModel"
  /federation/nodes/heartbeat:
    get:
      summary: Monitor federated node health
      tags: [Federated Learning]
      responses:
        "200":
          description: Node status information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeHealthStatus"
  # === SYMBOLIC REASONING ===
  /reasoning/validate-hypothesis:
    post:
      summary: Validate symbolic hypothesis
      tags: [Symbolic Reasoning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HypothesisRequest"
      responses:
        "200":
          description: Hypothesis validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HypothesisResponse"
  /logic/verify-proofs:
    post:
      summary: Verify symbolic logic proofs
      tags: [Symbolic Reasoning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                proof:
                  type: string
                axioms:
                  type: array
                  items:
                    type: string
                logic_system:
                  type: string
                  enum: [propositional, predicate, modal]
      responses:
        "200":
          description: Proof verification result
  /logic/trace/chain:
    post:
      summary: Trace multi-hop logic chains
      tags: [Symbolic Reasoning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                premises:
                  type: array
                  items:
                    type: string
                target_conclusion:
                  type: string
      responses:
        "200":
          description: Logic chain trace
  # === GEOSPATIAL & SATELLITE ===
  /geo/alerts/live:
    get:
      summary: Stream real-time geospatial alerts (WebSocket upgrade)
      tags: [Geospatial]
      responses:
        "101":
          description: Switching protocols to WebSocket
  /geo/alerts/subscribe:
    post:
      summary: Subscribe to specific geospatial alert types
      tags: [Geospatial]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                alert_types:
                  type: array
                  items:
                    type: string
                    enum: [earthquake, flood, wildfire, storm, epidemic]
                regions:
                  type: array
                  items:
                    type: string
                webhook_url:
                  type: string
      responses:
        "201":
          description: Subscription created
  /satellite/imagery:
    get:
      summary: Access satellite imagery data
      tags: [Geospatial]
      parameters:
        - in: query
          name: lat
          required: true
          schema:
            type: number
        - in: query
          name: lon
          required: true
          schema:
            type: number
        - in: query
          name: zoom
          schema:
            type: integer
            default: 10
        - in: query
          name: date_range
          schema:
            type: string
      responses:
        "200":
          description: Satellite imagery data
          # === BIOINFORMATICS ===
  /bio/course-alignment:
    post:
      summary: Align bioinformatics course content with curriculum standards
      tags: [Bioinformatics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                course_modules:
                  type: array
                  items:
                    type: string
                standard_framework:
                  type: string
                  enum: [iscb, abf, custom]
      responses:
        "200":
          description: Curriculum alignment results
  /bio/software-competency-analysis:
    post:
      summary: Analyze student proficiency in bioinformatics software
      tags: [Bioinformatics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: string
                tools_used:
                  type: array
                  items:
                    type: string
                usage_metrics:
                  type: object
      responses:
        "200":
          description: Competency assessment and recommendations
  /bio/publication-forecast:
    post:
      summary: Forecast trends in bioinformatics academic publications
      tags: [Bioinformatics]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subfield:
                  type: string
                  enum:
                    [
                      genomics,
                      systems_biology,
                      proteomics,
                      structural_bioinformatics,
                    ]
                citation_sources:
                  type: array
                  items:
                    type: string
                time_range:
                  type: object
                  properties:
                    start_year:
                      type: integer
                    end_year:
                      type: integer
      responses:
        "200":
          description: Forecasted publication trends
  # === ORACLE & PREDICTIONS ===
  /oracle/insight:
    post:
      summary: Query oracle engine for predictions
      tags: [Oracle & Predictions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic]
              properties:
                topic:
                  type: string
                time_horizon:
                  type: string
                  enum: [short_term, medium_term, long_term]
                confidence_level:
                  type: number
                  minimum: 0
                  maximum: 1
            examples:
              climate_short_term:
                summary: Short-term climate prediction
                value:
                  topic: "climate change impacts"
                  time_horizon: short_term
                  confidence_level: 0.85
              epidemic_long_term:
                summary: Long-term epidemic foresight
                value:
                  topic: "future viral outbreaks"
                  time_horizon: long_term
                  confidence_level: 0.9
      responses:
        "200":
          description: Prediction returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OracleInsight"
  # === SECURITY & AUDIT ===
  /security/logs:
    get:
      summary: Retrieve security audit logs
      tags: [Security]
      parameters:
        - in: query
          name: start_date
          schema:
            type: string
            format: date-time
        - in: query
          name: end_date
          schema:
            type: string
            format: date-time
        - in: query
          name: log_level
          schema:
            type: string
            enum: [info, warning, error, critical]
      responses:
        "200":
          description: Audit logs retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogs"
  /security/enhanced:
    post:
      summary: Enhance security measures
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                security_level:
                  type: string
                  enum: [low, medium, high, maximum]
                measures:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Security measures enhanced
  /session/revoke:
    post:
      summary: Revoke user session
      tags: [Security]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                session_id:
                  type: string
                user_id:
                  type: string
      responses:
        "200":
          description: Session revoked successfully
  /images/generations:
    post:
      summary: Generate images from text prompts
      tags: [Image AI]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompts]
              properties:
                prompts:
                  type: string
                n:
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
                size:
                  type: string
                  enum: [256x256, 512x512, 1024x1024, 1792x1024, 1024x1792]
                  default: 1024x1024
                quality:
                  type: string
                  enum: [standard, hd]
                  default: standard
            examples:
              futuristic-sunset:
                summary: Futuristic cityscape
                value:
                  prompts: "A futuristic cityscape at sunset"
                  n: 2
                  size: 1024x1024
              rainforest-scene:
                summary: Jungle scene
                value:
                  prompts: "A dense jungle with mist and sunlight filtering through"
                  n: 1
                  size: 512x512
      responses:
        "200":
          description: Images generated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationResponse"
  /images/edits:
    post:
      summary: Edit images based on a prompt
      tags: [Image AI]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, prompt]
              properties:
                image:
                  type: string
                  format: binary
                mask:
                  type: string
                  format: binary
                prompts:
                  type: string
                n:
                  type: integer
                  default: 1
                size:
                  type: string
                  enum: [256x256, 512x512, 1024x1024]
            examples:
              beach-edit:
                summary: Add beach background
                value:
                  prompts: "Replace background with tropical beach"
                  n: 2
                  size: 512x512
              city-edit:
                summary: Add neon city lights
                value:
                  prompts: "Overlay neon city lights in the background"
                  n: 1
                  size: 1024x1024
      responses:
        "200":
          description: Images edited successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationResponse"
  /images/variations:
    post:
      summary: Create variations of an existing image
      tags: [Image AI]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                n:
                  type: integer
                  default: 1
                size:
                  type: string
                  enum: [256x256, 512x512, 1024x1024]
            examples:
              variation-1:
                summary: Basic variation
                value:
                  n: 2
                  size: 512x512
              variation-2:
                summary: High resolution
                value:
                  n: 1
                  size: 1024x1024
      responses:
        "200":
          description: Image variations created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationResponse"
  /audio/transcriptions:
    post:
      summary: Create a transcription of an audio file
      tags: [Audio AI]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model]
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                  enum: [whisper-1]
                prompt:
                  type: string
                response_format:
                  type: string
                  enum: [json, text, srt, verbose_json, vtt]
                  default: json
                temperature:
                  type: number
                  minimum: 0
                  maximum: 1
            examples:
              english-audio:
                summary: Basic transcription
                value:
                  model: whisper-1
                  response_format: json
              verbose-srt:
                summary: Subtitle mode
                value:
                  model: whisper-1
                  response_format: srt
      responses:
        "200":
          description: Transcription created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResponse"
  /audio/translations:
    post:
      summary: Create a translation of an audio file
      tags: [Audio AI]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, model]
              properties:
                file:
                  type: string
                  format: binary
                model:
                  type: string
                  enum: [whisper-1]
                prompt:
                  type: string
                response_format:
                  type: string
                  enum: [json, text, srt, verbose_json, vtt]
                  default: json
            examples:
              translate-1:
                summary: English to French
                value:
                  model: whisper-1
                  response_format: text
              translate-2:
                summary: English to Hausa
                value:
                  model: whisper-1
                  response_format: verbose_json
      responses:
        "200":
          description: Translation created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptionResponse"
                # === EMBEDDINGS ===
  /embeddings:
    post:
      summary: Create embeddings for a given input
      tags: [Embeddings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model:
                  type: string
                input:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                encoding_format:
                  type: string
                  enum: [float, base64]
                  default: float
              example:
                - summary: Single sentence input
                  value:
                    model: text-embedding-ada-002
                    input: "Generate an embedding for this sentence."
                    encoding_format: float
                - summary: Array of sentences
                  value:
                    model: text-embedding-ada-002
                    input:
                      - "The sky is blue."
                      - "Mastomys Natalensis is a rodent species."
                    encoding_format: base64
      responses:
        "200":
          description: Embedding created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingResponse"
  # === DATA PROCESSING ===
  /data-cleaning:
    post:
      summary: Perform data cleaning operations
      tags: [Data Processing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                imputation_strategies:
                  type: array
                  items:
                    type: string
                    enum: [mean, median, mode, forward_fill, backward_fill]
                outlier_handling:
                  type: string
                  enum: [z_score, iqr, isolation_forest]
                normalization_scaling:
                  type: string
                  enum: [min_max, standard, robust]
      responses:
        "200":
          description: Data cleaned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataProcessingResponse"
  /data-transformation:
    post:
      summary: Perform data transformations
      tags: [Data Processing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                transformations:
                  type: array
                  items:
                    type: string
                    enum: [pivot, melt, aggregate, join, filter]
      responses:
        "200":
          description: Data transformed successfully
  /data-quality:
    post:
      summary: Monitor and report data quality
      tags: [Data Processing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                quality_checks:
                  type: array
                  items:
                    type: string
                    enum: [completeness, accuracy, consistency, validity]
      responses:
        "200":
          description: Data quality report generated
  /data-enrichment:
    post:
      summary: Enrich data with external sources
      tags: [Data Processing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                enrichment_sources:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Data enriched successfully
  /ai-insights:
    post:
      summary: Generate AI-assisted data insights
      tags: [Data Processing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                analysis_type:
                  type: string
                  enum: [correlation, trend, anomaly, prediction]
      responses:
        "200":
          description: AI insights generated successfully
  /ml-preprocessing:
    post:
      summary: Preprocess data for machine learning
      tags: [Data Processing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    type: object
                target_column:
                  type: string
                test_size:
                  type: number
                  minimum: 0
                  maximum: 1
                  default: 0.2
      responses:
        "200":
          description: Data preprocessed for ML successfully
  /performance-optimization:
    post:
      summary: Optimize performance for large datasets
      tags: [Data Processing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data_size:
                  type: integer
                optimization_type:
                  type: string
                  enum: [parallel_processing, caching, indexing]
      responses:
        "200":
          description: Performance optimized successfully
  # === INTEGRATION ENDPOINTS ===
  /integration/mapping/mapbox:
    post:
      summary: Integrate with Mapbox for mapping services
      tags: [Integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MapboxIntegration"
      responses:
        "200":
          description: Mapbox integrated successfully
  /integration/mapping/openlayers:
    post:
      summary: Integrate with OpenLayers for web mapping
      tags: [Integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericIntegration"
      responses:
        "200":
          description: OpenLayers integrated successfully
  /integration/supply-chain/dhl:
    post:
      summary: Integrate with DHL for logistics
      tags: [Integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericIntegration"
      responses:
        "200":
          description: DHL integrated successfully
  /integration/design/figma:
    post:
      summary: Integrate with Figma for design collaboration
      tags: [Integrations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericIntegration"
      responses:
        "200":
          description: Figma integrated successfully
  # === DASHBOARD & UI ===
  /dashboard/client-mock:
    get:
      summary: Return mock dashboard layout
      tags: [Dashboard]
      responses:
        "200":
          description: Mock dashboard layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardLayout"
  /dashboard/state:
    get:
      summary: Get current dashboard state
      tags: [Dashboard]
      responses:
        "200":
          description: Dashboard state retrieved
    post:
      summary: Update dashboard state
      tags: [Dashboard]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                widgets:
                  type: array
                  items:
                    type: object
                theme:
                  type: string
                  enum: [light, dark, auto]
      responses:
        "200":
          description: Dashboard state updated
  # === FUNCTION CALLING ===
  /functions/call:
    post:
      summary: Generate JSON for function calls based on user input
      tags: [Function Calling]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model:
                  type: string
                  enum: [gpt-4o, gpt-4o-mini, gpt-4-turbo]
                messages:
                  type: array
                  items:
                    $ref: "#/components/schemas/ChatMessage"
                functions:
                  type: array
                  items:
                    $ref: "#/components/schemas/FunctionDefinition"
                tool_choice:
                  type: string
                  enum: [auto, required, none]
                  default: auto
      responses:
        "200":
          description: Function call response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionResponse"
  # === LEGACY/SPECIALIZED ENDPOINTS ===
  /roadmap-feedback:
    post:
      summary: Submit feedback on enhancement roadmap
      tags: [Feedback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackSubmission"
      responses:
        "200":
          description: Feedback submitted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackResponse"
  /pilotTesting:
    post:
      summary: Conduct pilot interventions in identified hotspots
      tags: [Research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                location:
                  type: string
                intervention_type:
                  type: string
                parameters:
                  type: object
      responses:
        "200":
          description: Pilot testing completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  results:
                    type: object
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://api.mostar.ai/oauth/authorize
          tokenUrl: https://api.mostar.ai/oauth/token
          scopes:
            read: Read access to resources
            write: Write access to resources
            admin: Administrative access
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    # === CORE AI SCHEMAS ===
    AssistantResponse:
      type: object
      properties:
        response:
          type: string
          example:
            - "I can help you with data analysis, visualization, and insights generation."
            - "I specialize in bioinformatics workflows and research suggestions."
        context_id:
          type: string
          description: ID of the conversational context
        persona_used:
          type: string
          description: Persona identifier used in the interaction
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 timestamp of the response
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, function]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum: [text, image_url]
                  text:
                    type: string
                  image_url:
                    type: object
                    properties:
                      url:
                        type: string
                      detail:
                        type: string
                        enum: [low, high, auto]
        name:
          type: string
        function_call:
          type: object
          properties:
            name:
              type: string
            arguments:
              type: string
    ChatCompletionResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              message:
                $ref: "#/components/schemas/ChatMessage"
              finish_reason:
                type: string
                enum: [stop, length, function_call, content_filter]
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
    # === PERSONA & MEMORY SCHEMAS ===
    PersonaConfig:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        instructions:
          type: string
        capabilities:
          type: array
          items:
            type: string
        memory_scope:
          type: string
          enum: [session, persistent, shared]
        security_level:
          type: string
          enum: [public, private, restricted]
    MemoryState:
      type: object
      properties:
        user_id:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/MemoryEntry"
        total_size:
          type: integer
        last_updated:
          type: string
          format: date-time
    MemoryEntry:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        content:
          type: string
        type:
          type: string
          enum: [conversation, preference, fact, context]
        importance:
          type: number
          minimum: 0
          maximum: 1
        timestamp:
          type: string
          format: date-time
        tags:
          type: array
          items:
            type: string
    # === FEDERATED LEARNING SCHEMAS ===
    GlobalModel:
      type: object
      properties:
        version:
          type: string
        weights:
          type: array
          items:
            type: number
        metadata:
          type: object
          properties:
            training_rounds:
              type: integer
            participating_nodes:
              type: array
              items:
                type: string
            performance_metrics:
              type: object
    NodeHealthStatus:
      type: object
      properties:
        active_nodes:
          type: integer
        total_registered:
          type: integer
        nodes:
          type: array
          items:
            type: object
            properties:
              node_id:
                type: string
              status:
                type: string
                enum: [active, inactive, training, error]
              last_heartbeat:
                type: string
                format: date-time
              capabilities:
                type: array
                items:
                  type: string
    # === SYMBOLIC REASONING SCHEMAS ===
    HypothesisRequest:
      type: object
      properties:
        hypothesis:
          type: string
        domain:
          type: string
        evidence:
          type: array
          items:
            type: string
        confidence_threshold:
          type: number
          minimum: 0
          maximum: 1
    HypothesisResponse:
      type: object
      properties:
        valid:
          type: boolean
        confidence:
          type: number
        reasoning_chain:
          type: array
          items:
            type: string
        supporting_evidence:
          type: array
          items:
            type: string
        contradicting_evidence:
          type: array
          items:
            type: string
    # === ORACLE & PREDICTIONS SCHEMAS ===
    OracleInsight:
      type: object
      properties:
        prediction:
          type: string
        confidence:
          type: number
        time_horizon:
          type: string
        factors:
          type: array
          items:
            type: object
            properties:
              factor:
                type: string
              weight:
                type: number
        uncertainty_range:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
    # === SECURITY SCHEMAS ===
    AuditLogs:
      type: object
      properties:
        logs:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              level:
                type: string
              message:
                type: string
              user_id:
                type: string
              ip_address:
                type: string
              action:
                type: string
        total_count:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
    # === IMAGE GENERATION SCHEMAS ===
    ImageGenerationResponse:
      type: object
      properties:
        created:
          type: integer
        data:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              b64_json:
                type: string
              revised_prompt:
                type: string
    # === AUDIO PROCESSING SCHEMAS ===
    TranscriptionResponse:
      type: object
      properties:
        text:
          type: string
        language:
          type: string
        duration:
          type: number
        segments:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              seek:
                type: number
              start:
                type: number
              end:
                type: number
              text:
                type: string
              tokens:
                type: array
                items:
                  type: integer
              temperature:
                type: number
    # === EMBEDDINGS SCHEMAS ===
    EmbeddingResponse:
      type: object
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            type: object
            properties:
              object:
                type: string
                enum: [embedding]
              embedding:
                type: array
                items:
                  type: number
              index:
                type: integer
        model:
          type: string
        usage:
          type: object
          properties:
            prompt_tokens:
              type: integer
            total_tokens:
              type: integer
    # === DATA PROCESSING SCHEMAS ===
    DataProcessingResponse:
      type: object
      properties:
        processed_data:
          type: array
          items:
            type: object
        operations_applied:
          type: array
          items:
            type: string
        quality_score:
          type: number
          minimum: 0
          maximum: 1
        statistics:
          type: object
          properties:
            rows_processed:
              type: integer
            columns_processed:
              type: integer
            missing_values_handled:
              type: integer
            outliers_detected:
              type: integer
    # === INTEGRATION SCHEMAS ===
    MapboxIntegration:
      type: object
      properties:
        api_key:
          type: string
        map_style:
          type: string
          enum: [streets, outdoors, light, dark, satellite]
        features:
          type: array
          items:
            type: string
            enum: [markers, routing, geocoding, traffic]
    GenericIntegration:
      type: object
      properties:
        service_name:
          type: string
        api_key:
          type: string
        configuration:
          type: object
        webhook_url:
          type: string
    # === DASHBOARD SCHEMAS ===
    DashboardLayout:
      type: object
      properties:
        widgets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
                enum: [chart, map, table, metric, alert]
              position:
                type: object
                properties:
                  x:
                    type: integer
                  y:
                    type: integer
                  width:
                    type: integer
                  height:
                    type: integer
              config:
                type: object
        theme:
          type: string
          enum: [light, dark, auto]
        auto_refresh:
          type: boolean
        refresh_interval:
          type: integer
    # === FUNCTION CALLING SCHEMAS ===
    FunctionDefinition:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parameters:
          type: object
          properties:
            type:
              type: string
              enum: [object]
            properties:
              type: object
            required:
              type: array
              items:
                type: string
    # === FEEDBACK SCHEMAS ===
    FeedbackSubmission:
      type: object
      properties:
        category:
          type: string
          enum: [bug_report, feature_request, improvement, general]
        title:
          type: string
        description:
          type: string
        priority:
          type: string
          enum: [low, medium, high, critical]
        user_info:
          type: object
          properties:
            user_id:
              type: string
            email:
              type: string
        attachments:
          type: array
          items:
            type: string
    FeedbackResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [submitted, under_review, in_progress, completed, rejected]
        acknowledgment:
          type: string
        estimated_timeline:
          type: string
        tracking_id:
          type: string
    # === ERROR SCHEMAS ===
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
            request_id:
              type: string
            timestamp:
              type: string
              format: date-time
tags:
  - name: Core AI
    description: Primary AI assistant and chat completion endpoints
  - name: Persona Management
    description: Manage AI persona configurations and behaviors
  - name: Memory Management
    description: Handle persistent memory and context storage
  - name: Federated Learning
    description: Distributed learning and model aggregation
  - name: Symbolic Reasoning
    description: Logic validation and symbolic AI capabilities
  - name: Geospatial
    description: Satellite imagery and geospatial alert systems
  - name: Bioinformatics
    description: Genomics, protein analysis, and epidemic modeling
  - name: Oracle & Predictions
    description: Predictive analytics and insight generation
  - name: Security
    description: Security auditing and compliance features
  - name: Image AI
    description: Image generation, editing, and manipulation
  - name: Audio AI
    description: Speech transcription and translation
  - name: Embeddings
    description: Vector embeddings for semantic search
  - name: Data Processing
    description: Advanced data cleaning, transformation, and analysis
  - name: Integrations
    description: Third-party service integrations
  - name: Dashboard
    description: UI scaffolding and dashboard management
  - name: Function Calling
    description: Structured function calling capabilities
  - name: Feedback
    description: User feedback and roadmap submissions
  - name: Research
    description: Specialized research and pilot testing endpoints
